name: OMP Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  # Nightly and on-demand package builds; releases build from their push. See
  # the `build` job.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Package builds (nightly, manual, release) get their own never-cancelled group
# so a later push to main cannot cancel them mid-build. Releases are recognized
# by the `chore: bump version to ` subject, as in ci.yml.
concurrency:
  group: "${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump version to ')) && format('build-{0}', github.run_id) || github.ref }}"
  cancel-in-progress: "${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump version to ')) }}"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Verify generated Bun dependencies
        run: nix build --no-link .#checks.x86_64-linux.bun-lock --show-trace

  # A cold build without a binary cache takes ~30 minutes, so ordinary pushes
  # and pull requests only evaluate; the package builds and is smoke-tested
  # nightly, on manual dispatch, and on release pushes. Thin LTO exercises the
  # same derivations as release builds at a fraction of the link.
  build:
    name: Build package
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: bump version to '))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build omp with thin LTO
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs --show-trace --impure \
            --expr "(builtins.getFlake \"git+file://$GITHUB_WORKSPACE\").packages.x86_64-linux.omp.override { withFatLto = false; }")
          echo "OMP_OUT=$out" >> "$GITHUB_ENV"
      - name: Smoke-test omp
        run: |
          "$OMP_OUT/bin/omp" --version
          "$OMP_OUT/bin/omp" --smoke-test
